<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<title>Activities &amp; marking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="ltop"></header>
<main class="wrap wide">


  <div id="app" class="shell" hidden>
    <aside class="side">
      <div class="card">
        <div class="row" style="align-items:center"><h2 style="margin:0">Activities</h2><button class="btn small" id="newBtn">New activity</button></div>
        <div id="acts" class="acts"></div>
      </div>
    </aside>

    <div class="main">
    <div class="card" id="emptyMain">
      <div class="empty"><b>Choose an activity</b>Pick one on the left to see its submissions, or create a new one.</div>
    </div>

    <div class="card" id="newCard" hidden>
      <h2>New activity</h2>
      <form id="newForm">
        <div class="grid">
          <div><label for="aTitle">Title</label><input id="aTitle" maxlength="120" required placeholder="Week 3 seminar — SQL joins"></div>
          <div><label for="aModule">Module (optional)</label><input id="aModule" maxlength="40" placeholder="COM106"></div>
          <div><label for="aDeadline">Deadline (optional)</label><input id="aDeadline" type="datetime-local"></div>
          <div><label for="aOut">Mark out of (optional)</label><input id="aOut" type="number" min="1" step="1" placeholder="No mark"></div>
        </div>
        <div class="grid" id="aPlace">
          <div><label for="aMod">Add to module (optional)</label><select id="aMod"><option value="">Not in a module</option></select></div>
          <div><label for="aWeek">Week</label><select id="aWeek" disabled></select></div>
        </div>
        <label class="check"><input type="checkbox" id="aLate" checked> Accept late submissions (they're flagged as late)</label>
        <label for="aBrief">Instructions for students</label>
        <textarea id="aBrief" placeholder="What to do, what to upload, file format…"></textarea>
        <label for="aFiles">Worksheet or files for students (optional)</label>
        <input id="aFiles" type="file" multiple>
        <p class="muted">Students download these from the activity page. Up to 50 MB per file.</p>
        <label for="aCrit">Feedback criteria — one per line</label>
        <textarea id="aCrit" style="min-height:100px" placeholder="Correct use of INNER and LEFT JOIN&#10;Queries return the expected rows&#10;Clear, consistently formatted SQL"></textarea>
        <label class="check"><input type="checkbox" id="aShowCrit" checked> Show criteria to students</label>
        <label for="aNotes">Model answer or marking notes (optional, only you and the AI checker see these)</label>
        <textarea id="aNotes" style="min-height:100px" placeholder="Expected answers, common mistakes to look for, what a good answer includes…"></textarea>
        <label for="aNotesFile">…or upload a model answer file (Word, PDF, text or code)</label>
        <input id="aNotesFile" type="file">
        <label for="aQc">Quick comments — one per line (only you see these)</label>
        <textarea id="aQc" style="min-height:100px" placeholder="Good use of aliases — it makes the joins easy to follow.&#10;Check which rows a LEFT JOIN keeps when there's no match."></textarea>
        <p class="actions" style="margin-top:14px">
          <button class="btn" id="createAct">Create activity &amp; code</button>
          <button class="btn ghost" type="button" id="cancelNew">Cancel</button>
        </p>
        <p id="newMsg" class="muted"></p>
      </form>
    </div>

    <!-- submissions -->
    <div class="card" id="subsCard" hidden>
      <div class="row">
        <div><p class="muted" id="sMod" style="margin:0"></p><h2 id="sTitle" style="margin:0"></h2><p class="muted" id="sInfo" style="margin:4px 0 0"></p></div>
        <div class="actions">
          <button class="btn ghost small" id="showCode">Show code</button>
          <button class="btn ghost small" id="refresh">Refresh</button>
          <button class="btn small" id="aiAll" hidden>AI draft all new</button>
          <button class="btn ghost small" id="releaseAll">Release all drafts</button>
          <button class="btn ghost small" id="exportCsv">Export CSV</button>
          <button class="btn danger small" id="toggleClose">Close submissions</button>
        </div>
      </div>
      <p id="sMsg" class="muted"></p>
      <div id="subs" style="overflow-x:auto"></div>
    </div>

    <!-- review -->
    <div class="split" id="review" hidden>
      <div class="card">
        <div class="row">
          <div><h2 id="rName" style="margin:0"></h2><p class="muted" id="rInfo" style="margin:4px 0 0"></p></div>
          <div class="actions"><button class="btn ghost small" id="prev">Previous</button><button class="btn ghost small" id="next">Next</button></div>
        </div>
        <div class="brief muted" id="rNote" hidden></div>
        <div class="tabs" id="rTabs"></div>
        <div class="preview" id="rPreview"></div>
        <p class="actions" style="margin-top:10px">
          <button class="btn ghost small" id="dlOne">Download this file</button>
          <button class="btn ghost small" id="dlAll">Download all</button>
        </p>
      </div>
      <div class="card sticky">
        <div class="row"><h2>Feedback</h2><button class="btn ghost small" id="aiOne" hidden>Draft with AI</button></div>
        <p class="chip partly" id="aiBadge" hidden>AI draft — check before releasing</p>
        <div id="fCrit"></div>
        <div id="fMarkWrap" hidden>
          <label for="fMark">Mark</label>
          <div style="display:flex;gap:8px;align-items:center"><input type="number" id="fMark" min="0" step="0.5" style="max-width:120px"><span class="muted" id="fOut"></span></div>
        </div>
        <label for="fText">Comments</label>
        <div class="qc" id="fQc"></div>
        <textarea id="fText" style="min-height:160px"></textarea>
        <p class="actions" style="margin-top:12px">
          <button class="btn ghost" id="saveDraft">Save draft</button>
          <button class="btn" id="release">Save &amp; release</button>
          <button class="btn danger" id="withdraw" hidden>Withdraw</button>
        </p>
        <p class="muted" id="fStatus"></p>
      </div>
    </div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="gh.js"></script>
<script src="lecturer.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const SVC = (SITE.submitUrl || "").replace(/\/+$/, "");
  const siteUrl = new URL("./", location.href);
  const siteHost = (siteUrl.host + siteUrl.pathname).replace(/\/$/, "");
  const LABEL = { met: "Met", partly: "Partly met", not: "Not yet" };
  const MAMMOTH = "vendor/mammoth.browser.min.js";
  const JSZIP = "vendor/jszip.min.js";
  const TEXT = /\.(txt|md|py|java|js|mjs|ts|jsx|tsx|html?|css|scss|json|sql|xml|ya?ml|c|h|cpp|hpp|cs|php|rb|go|rs|kt|swift|sh|bat|ps1|r|csv|tsv|log|ini|cfg|toml|env|gitignore|dockerfile)$/i;

  document.title = "Activities & marking · " + SITE.name;
  MS.brand();

  let L = null, conn = null, gh = null, vault = null, svc = null, index = null;
  let act = null, subs = [], pos = -1, cur = null, openSeq = 0, urls = [], aiOn = false;
  const PDFJS = "vendor/pdf.min.js";
  const PDFJS_WORKER = "vendor/pdf.worker.min.js";

  const busy = async (btn, label, fn) => {
    const before = btn.textContent;
    btn.disabled = true;
    if (label) btn.textContent = label;
    try { return await fn(); } finally { btn.disabled = false; if (!label || btn.textContent === label) btn.textContent = before; }
  };
  const say = (el, msg, cls) => { el.className = cls || "muted"; el.textContent = msg; };

  const loadIndex = () => L.loadIndex();
  const indexEntry = () => L.indexEntry(index);
  const publicMeta = (a) => ({ v: 1, created: a.created, deadline: a.deadline, late: a.late, closed: a.closed });

  async function start() {
    L = await Lecturer.ready("marking");
    ({ conn, gh, vault, svc } = L);
    try {
      index = await loadIndex();
    } catch (e) {
      document.querySelector("main").prepend(Lecturer.el("p", { class: "err", text: e.message || e.name }));
      return;
    }
    $("app").hidden = false;
    renderActs();
    if (L.SVC) {
      try { aiOn = !!(await (await svc("GET", "/admin/ping")).json()).ai; } catch (e) { $("sMsg").textContent = e.message; }
    }
    const m = location.hash.match(/^#a=([0-9a-f]{32})$/);
    const want = m && index.activities.find((a) => a.id === m[1]);
    if (want) openActivity(want);
  }

  // ---------- activities
  function stateChip(a) {
    const st = MS.activityState(a);
    const c = document.createElement("span");
    c.className = "chip " + ({ open: "met", late: "partly", closed: "" })[st];
    c.textContent = ({ open: "Open", late: "Open · late", closed: "Closed" })[st];
    return c;
  }

  function renderActs() {
    const box = $("acts");
    box.textContent = "";
    if (!index.activities.length) {
      box.innerHTML = '<p class="muted" style="margin:8px 2px">No activities yet. Create one, show its code in class, and students hand in with it.</p>';
      return;
    }
    for (const a of index.activities) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "act" + (act && act.id === a.id ? " on" : "");
      const t = document.createElement("span");
      t.className = "ttl";
      t.textContent = a.title;
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = [a.module, MS.pretty(a.code), a.deadline ? "due " + MS.fmtDate(a.deadline) : ""].filter(Boolean).join(", ");
      b.append(t, stateChip(a), sub);
      b.onclick = () => openActivity(a);
      box.append(b);
    }
  }

  function updateEmpty() {
    $("emptyMain").hidden = !$("newCard").hidden || !$("subsCard").hidden;
  }

  function fillModulePicker() {
    const sel = $("aMod");
    sel.length = 1;
    for (const m of index.modules || []) sel.append(Lecturer.el("option", { value: m.id, text: `${m.short}: ${m.title}` }));
    sel.onchange = () => {
      const m = (index.modules || []).find((x) => x.id === sel.value);
      const wk = $("aWeek");
      wk.textContent = "";
      wk.disabled = !m;
      if (!m) return;
      const cw = MS.currentWeek(m.start, m.weeks.length) || 1;
      for (const w of m.weeks) wk.append(Lecturer.el("option", { value: w.n, text: `Week ${w.n}` + (w.title ? `: ${w.title}` : ""), selected: w.n === cw }));
      if (!$("aModule").value) $("aModule").value = m.short;
    };
    sel.onchange();
  }

  $("newBtn").onclick = () => Lecturer.busy($("newBtn"), "", async () => {
    try { index = await loadIndex(); renderActs(); } catch {}
    fillModulePicker();
    $("newCard").hidden = false;
    updateEmpty();
    $("newCard").scrollIntoView({ block: "start" });
    $("aTitle").focus();
  });
  $("cancelNew").onclick = () => { $("newCard").hidden = true; updateEmpty(); };

  const lines = (id) => $(id).value.split("\n").map((s) => s.trim()).filter(Boolean);

  $("newForm").onsubmit = (ev) => {
    ev.preventDefault();
    busy($("createAct"), "Creating…", async () => {
      const m = $("newMsg");
      try {
        const code = MS.newCode();
        const d = await MS.derive(code, SITE.salt);
        const now = new Date().toISOString();
        const deadline = $("aDeadline").value ? new Date($("aDeadline").value).toISOString() : null;
        const outOf = Number($("aOut").value) > 0 ? Number($("aOut").value) : null;
        const sheets = [...$("aFiles").files];
        const big = sheets.filter((f) => f.size > 50 * 1024 * 1024);
        if (big.length) throw new Error("too large (max 50 MB each): " + big.map((f) => f.name).join(", "));
        let notes = $("aNotes").value.trim();
        const nf = $("aNotesFile").files[0];
        if (nf) {
          say(m, "Reading model answer…");
          const t = await extractText({ name: nf.name, data: new Uint8Array(await nf.arrayBuffer()) });
          notes = (notes ? notes + "\n\n" : "") + `[${nf.name}]\n` + t;
        }
        notes = notes.slice(0, 30000);
        const a = {
          code, id: d.id, title: $("aTitle").value.trim(), module: $("aModule").value.trim(), brief: $("aBrief").value.trim(),
          deadline, late: $("aLate").checked, showCriteria: $("aShowCrit").checked, criteria: lines("aCrit"),
          comments: lines("aQc"), outOf, notes, created: now, closed: false,
        };
        const sheetEntries = [], sheetList = [];
        for (let i = 0; i < sheets.length; i++) {
          say(m, `Encrypting ${sheets[i].name}…`);
          const data = new Uint8Array(await sheets[i].arrayBuffer());
          sheetEntries.push({ path: `a/${d.id}/w${i}.bin`, bytes: await MS.seal(d.key, data) });
          sheetList.push({ name: sheets[i].name, type: sheets[i].type || "application/octet-stream", size: data.byteLength, f: `w${i}.bin` });
        }
        a.files = sheetList.map((f) => f.name);
        const forStudents = { title: a.title, module: a.module, brief: a.brief, deadline, criteria: a.showCriteria ? a.criteria : [], files: sheetList };
        say(m, "Publishing…");
        index = await loadIndex();
        index.activities.unshift(a);
        const modEntries = [];
        const mod = (index.modules || []).find((x) => x.id === $("aMod").value);
        if (mod) {
          const wk = Number($("aWeek").value) || 1;
          mod.items.push({ id: MS.randHex(16), week: wk, kind: "activity", title: a.title, note: "", status: "published", at: null,
            key: MS.b64e(MS.randKey()), files: [], activity: { id: a.id, code: a.code, title: a.title }, created: now, published: now,
            order: mod.items.filter((i) => i.week === wk).length });
          modEntries.push(...(await Lecturer.moduleEntries(mod)));
        }
        await gh.commit([
          ...modEntries,
          { path: `a/${d.id}/meta.json`, bytes: MS.fromJSON(publicMeta(a)) },
          { path: `a/${d.id}/m.bin`, bytes: await MS.seal(d.key, MS.fromJSON(forStudents)) },
          ...sheetEntries,
          await indexEntry(),
        ], "Add activity");
        $("newForm").reset();
        $("aLate").checked = $("aShowCrit").checked = true;
        $("newCard").hidden = true;
        updateEmpty();
        say(m, "");
        renderActs();
        present(a, true);
        openActivity(a);
      } catch (e) {
        say(m, "Couldn't create: " + (e.message || e.name || "unknown error"), "err");
      }
    });
  };

  // ---------- presenter
  function present(a, fresh) {
    Lecturer.present({ title: [a.module, a.title].filter(Boolean).join(": "), code: a.code, fresh,
      sub: "to get the task and hand in your work" + (a.deadline ? " by " + MS.fmtDate(a.deadline) : "") + "." });
  }
  $("showCode").onclick = () => act && present(act);

  // ---------- submissions
  async function openActivity(a) {
    act = a;
    pos = -1;
    cur = null;
    $("review").hidden = true;
    $("subsCard").hidden = false;
    $("newCard").hidden = true;
    updateEmpty();
    $("sMod").textContent = a.module || "";
    $("sTitle").textContent = a.title;
    $("toggleClose").textContent = a.closed ? "Reopen submissions" : "Close submissions";
    $("toggleClose").className = a.closed ? "btn ghost small" : "btn danger small";
    $("aiAll").hidden = !aiOn;
    renderActs();
    $("subsCard").scrollIntoView({ behavior: "smooth", block: "start" });
    await loadSubs();
  }

  async function loadSubs() {
    const m = $("sMsg");
    say(m, "Loading submissions…");
    $("subs").textContent = "";
    try {
      const j = await (await svc("GET", `/admin/list?a=${act.id}`)).json();
      const drafts = new Map(j.drafts.map((d) => [d.r, d]));
      const out = [];
      for (const s of j.subs) {
        let info;
        try { info = MS.toJSON(await MS.openWith(vault.priv, MS.b64d(s.m))); }
        catch { info = { name: "(couldn't decrypt)", sid: "", t: new Date(s.t).toISOString() }; }
        out.push({ r: s.r, late: !!s.late, n: s.n, info, draft: drafts.get(s.r) || null });
      }
      // newest attempt per student is current; older ones are marked as earlier attempts
      const latest = new Map();
      for (const s of out) {
        const k = (s.info.sid || s.info.name || "").toLowerCase().replace(/\s+/g, "");
        s.key = k;
        if (!latest.has(k) || latest.get(k).info.t < s.info.t) latest.set(k, s);
      }
      for (const s of out) s.earlier = latest.get(s.key) !== s;
      out.sort((x, y) => x.info.name.localeCompare(y.info.name) || y.info.t.localeCompare(x.info.t));
      subs = out;
      say(m, "");
      renderSubs();
    } catch (e) {
      say(m, e.message || e.name, "err");
    }
  }

  function statusChip(s) {
    const c = document.createElement("span");
    if (!s.draft) { c.className = "chip new"; c.textContent = "New"; }
    else if (s.draft.rel) { c.className = "chip met"; c.textContent = "Released"; }
    else if (s.draft.ai) { c.className = "chip partly"; c.textContent = "AI draft"; }
    else { c.className = "chip partly"; c.textContent = "Draft"; }
    return c;
  }

  function renderSubs() {
    const released = subs.filter((s) => s.draft && s.draft.rel).length;
    const st = MS.activityState(act);
    $("sInfo").textContent = `${subs.length} submission${subs.length === 1 ? "" : "s"}, ${released} released. ` +
      (act.deadline ? "Due " + MS.fmtDate(act.deadline) + ", " : "") + ({ open: "open", late: "open for late work", closed: "closed" })[st] + ".";
    const box = $("subs");
    box.textContent = "";
    if (!subs.length) {
      box.innerHTML = `<p class="muted">No submissions yet. Students enter <b class="mono">${MS.pretty(act.code)}</b> on the student page to hand in.</p>`;
      return;
    }
    const t = document.createElement("table");
    t.innerHTML = "<tr><th>Student</th><th>Student no.</th><th>Submitted</th><th>Files</th><th>Status</th></tr>";
    subs.forEach((s, i) => {
      const tr = document.createElement("tr");
      tr.className = "click" + (i === pos ? " sel" : "");
      const name = document.createElement("td");
      name.textContent = s.info.name;
      if (s.earlier) { const e = document.createElement("span"); e.className = "chip"; e.textContent = "earlier attempt"; name.append(" ", e); }
      const sid = document.createElement("td");
      sid.textContent = s.info.sid;
      const when = document.createElement("td");
      when.textContent = MS.fmtDate(s.info.t);
      if (s.late) { const l = document.createElement("span"); l.className = "chip not"; l.textContent = "late"; when.append(" ", l); }
      const files = document.createElement("td");
      files.textContent = `${s.info.n || "?"} · ${MS.sizeText(s.info.size || s.n || 0)}`;
      const status = document.createElement("td");
      status.append(statusChip(s));
      tr.append(name, sid, when, files, status);
      tr.onclick = () => openSub(i);
      t.append(tr);
    });
    box.append(t);
  }

  $("refresh").onclick = () => busy($("refresh"), "Refreshing…", loadSubs);

  $("toggleClose").onclick = () => busy($("toggleClose"), "Saving…", async () => {
    try {
      index = await loadIndex();
      const a = index.activities.find((x) => x.id === act.id);
      a.closed = !a.closed;
      await gh.commit([{ path: `a/${a.id}/meta.json`, bytes: MS.fromJSON(publicMeta(a)) }, await indexEntry()],
        a.closed ? "Close activity" : "Reopen activity");
      act = a;
      say($("sMsg"), a.closed ? "Closed. New submissions are refused within about a minute." : "Reopened.", "muted");
      renderActs();
      renderSubs();
    } catch (e) {
      say($("sMsg"), e.message || e.name, "err");
    }
  }).then(() => {
    $("toggleClose").textContent = act.closed ? "Reopen submissions" : "Close submissions";
    $("toggleClose").className = act.closed ? "btn ghost small" : "btn danger small";
  });

  // ---------- review one submission
  async function openSub(i) {
    const seq = ++openSeq;
    pos = i;
    const s = subs[i];
    renderSubs();
    $("review").hidden = false;
    $("rName").textContent = s.info.name;
    $("rInfo").textContent = [s.info.sid, "submitted " + MS.fmtDate(s.info.t), s.late ? "late" : "", s.earlier ? "earlier attempt" : ""].filter(Boolean).join(", ");
    $("rTabs").textContent = "";
    $("rNote").hidden = true;
    setPreviewNote("Decrypting…");
    $("prev").disabled = i === 0;
    $("next").disabled = i === subs.length - 1;
    fillForm(null, true);
    $("review").scrollIntoView({ behavior: "smooth", block: "start" });
    try {
      const blob = await (await svc("GET", `/admin/sub?a=${act.id}&r=${s.r}`)).arrayBuffer();
      const pkg = MS.unpack(await MS.openWith(vault.priv, blob));
      let draft = null;
      if (s.draft) draft = MS.toJSON(await MS.unseal(vault.vk, await (await svc("GET", `/admin/draft?a=${act.id}&r=${s.r}`)).arrayBuffer()));
      if (seq !== openSeq) return;
      cur = { s, pkg, draft, file: 0 };
      if (pkg.header.note) { $("rNote").hidden = false; $("rNote").textContent = "Student's note: " + pkg.header.note; }
      renderTabs();
      showFile(0);
      fillForm(draft);
    } catch (e) {
      if (seq === openSeq) setPreviewNote("Couldn't open this submission: " + e.message);
    }
  }

  $("prev").onclick = () => pos > 0 && openSub(pos - 1);
  $("next").onclick = () => pos < subs.length - 1 && openSub(pos + 1);

  function renderTabs() {
    const box = $("rTabs");
    box.textContent = "";
    cur.pkg.files.forEach((f, k) => {
      const b = document.createElement("button");
      b.className = "btn ghost small" + (k === cur.file ? " on" : "");
      b.textContent = `${f.name} (${MS.sizeText(f.size)})`;
      b.onclick = () => showFile(k);
      box.append(b);
    });
  }

  function setPreviewNote(msg) {
    const box = $("rPreview");
    box.textContent = "";
    const p = document.createElement("p");
    p.className = "note muted";
    p.textContent = msg;
    box.append(p);
  }

  function blobUrl(data, type) {
    const u = URL.createObjectURL(new Blob([data], { type }));
    urls.push(u);
    return u;
  }

  const scripts = {};
  function loadScript(src) {
    return scripts[src] || (scripts[src] = new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = ok;
      s.onerror = () => { delete scripts[src]; fail(new Error("couldn't load the previewer")); };
      document.head.append(s);
    }));
  }

  const looksText = (d) => { const n = Math.min(d.length, 4000); for (let i = 0; i < n; i++) if (d[i] === 0) return false; return true; };

  // Student files are untrusted: nothing they contain is ever run on this page.
  // HTML/SVG-as-document is shown as source text; Word documents render in a sandboxed frame with scripts disabled.
  async function showFile(k) {
    cur.file = k;
    renderTabs();
    urls.forEach(URL.revokeObjectURL);
    urls = [];
    const f = cur.pkg.files[k];
    const name = f.name.toLowerCase();
    const box = $("rPreview");
    box.textContent = "";
    try {
      if (name.endsWith(".pdf")) {
        const fr = document.createElement("iframe");
        fr.title = f.name;
        fr.src = blobUrl(f.data, "application/pdf");
        box.append(fr);
      } else if (/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name)) {
        const img = document.createElement("img");
        img.alt = f.name;
        img.src = blobUrl(f.data, name.endsWith(".svg") ? "image/svg+xml" : f.type || "image/png");
        box.append(img);
      } else if (name.endsWith(".docx")) {
        setPreviewNote("Rendering Word document…");
        await loadScript(MAMMOTH);
        const res = await mammoth.convertToHtml({ arrayBuffer: f.data.slice().buffer });
        if (cur.pkg.files[cur.file] !== f) return;
        box.textContent = "";
        const fr = document.createElement("iframe");
        fr.title = f.name;
        fr.setAttribute("sandbox", "");
        fr.srcdoc = '<!doctype html><meta charset="utf-8"><style>body{font:15px/1.55 system-ui,sans-serif;color:#1c2230;background:#fff;padding:16px 22px;margin:0}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px;vertical-align:top}</style>' + res.value;
        box.append(fr);
      } else if (name.endsWith(".ipynb")) {
        renderNotebook(box, MS.toJSON(f.data));
      } else if (name.endsWith(".zip")) {
        await loadScript(JSZIP);
        const zip = await JSZip.loadAsync(f.data);
        const pre = document.createElement("pre");
        const list = [];
        zip.forEach((p, e) => { if (!e.dir) list.push(p); });
        pre.textContent = "Zip contents (" + list.length + " files) — download to open:\n\n" + list.join("\n");
        box.append(pre);
      } else if (TEXT.test(name) || looksText(f.data)) {
        const pre = document.createElement("pre");
        pre.textContent = MS.text(f.data);
        box.append(pre);
      } else {
        setPreviewNote("No preview for this file type — download it to open.");
      }
    } catch (e) {
      setPreviewNote("Couldn't preview this file (" + e.message + "). Download it to open.");
    }
  }

  function renderNotebook(box, nb) {
    const src = (v) => (Array.isArray(v) ? v.join("") : v || "");
    for (const c of nb.cells || []) {
      const d = document.createElement("div");
      d.className = "cell";
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = c.cell_type === "code" ? `In [${c.execution_count ?? " "}]` : c.cell_type;
      const body = document.createElement(c.cell_type === "code" ? "pre" : "div");
      if (c.cell_type !== "code") body.style.whiteSpace = "pre-wrap";
      else body.style.padding = "6px 0";
      body.textContent = src(c.source);
      d.append(tag, body);
      for (const o of c.outputs || []) {
        const data = o.data || {};
        if (data["image/png"]) {
          const img = document.createElement("img");
          img.src = "data:image/png;base64," + src(data["image/png"]).replace(/\s/g, "");
          d.append(img);
        } else {
          const t = o.text || data["text/plain"] || (o.ename ? `${o.ename}: ${o.evalue}` : "");
          if (!t) continue;
          const pre = document.createElement("pre");
          pre.className = "out";
          pre.style.padding = "4px 0";
          pre.textContent = src(t);
          d.append(pre);
        }
      }
      box.append(d);
    }
  }

  function download(blob, name) {
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = u;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  }
  const safeName = (s) => s.replace(/[^\w\-. ]+/g, "").trim() || "submission";

  $("dlOne").onclick = () => {
    if (!cur) return;
    const f = cur.pkg.files[cur.file];
    download(new Blob([f.data], { type: "application/octet-stream" }), f.name);
  };
  $("dlAll").onclick = () => cur && busy($("dlAll"), "Zipping…", async () => {
    await loadScript(JSZIP);
    const zip = new JSZip();
    for (const f of cur.pkg.files) zip.file(f.name, f.data);
    download(await zip.generateAsync({ type: "blob" }), safeName(`${cur.s.info.name} ${cur.s.info.sid}`) + ".zip");
  });

  // ---------- feedback form
  function fillForm(d, loading) {
    const box = $("fCrit");
    box.textContent = "";
    act.criteria.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "crit";
      const t = document.createElement("span");
      t.textContent = c;
      const seg = document.createElement("div");
      seg.className = "seg";
      seg.setAttribute("role", "radiogroup");
      seg.setAttribute("aria-label", c);
      for (const v of ["met", "partly", "not"]) {
        const l = document.createElement("label");
        const inp = document.createElement("input");
        inp.type = "radio";
        inp.name = "c" + i;
        inp.value = v;
        inp.checked = !!(d && d.criteria && d.criteria[i] === v);
        inp.onclick = () => { if (inp.dataset.was === "1") { inp.checked = false; inp.dataset.was = ""; } else { seg.querySelectorAll("input").forEach((x) => (x.dataset.was = "")); inp.dataset.was = "1"; } };
        if (inp.checked) inp.dataset.was = "1";
        l.append(inp, LABEL[v]);
        seg.append(l);
      }
      row.append(t, seg);
      const why = d && d.reasons && d.reasons[i];
      if (why) {
        const w = document.createElement("div");
        w.className = "muted";
        w.style.cssText = "flex-basis:100%;font-size:.8rem";
        w.textContent = "AI: " + why;
        row.append(w);
      }
      box.append(row);
    });
    $("aiBadge").hidden = !(d && d.ai);
    $("aiOne").hidden = !aiOn || !!(d && d.released);
    $("fMarkWrap").hidden = !act.outOf;
    $("fOut").textContent = act.outOf ? "out of " + act.outOf : "";
    $("fMark").value = d && d.mark !== null && d.mark !== undefined ? d.mark : "";
    const qc = $("fQc");
    qc.textContent = "";
    for (const c of act.comments || []) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.onclick = () => insertComment(c);
      qc.append(b);
    }
    $("fText").value = (d && d.comment) || "";
    $("withdraw").hidden = !(d && d.released);
    $("release").textContent = d && d.released ? "Save & update" : "Save & release";
    $("saveDraft").hidden = !!(d && d.released);
    for (const id of ["saveDraft", "release", "withdraw", "aiOne"]) $(id).disabled = !!loading;
    say($("fStatus"), loading ? "" : d ? (d.released ? "Released to the student " + MS.fmtDate(d.releasedAt) + "." : (d.ai ? "AI draft " : "Draft saved ") + MS.fmtDate(d.t) + " — not visible to the student yet.") : "Not started.");
  }

  function insertComment(text) {
    const ta = $("fText");
    const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
    const before = ta.value.slice(0, s), after = ta.value.slice(e);
    const sep = before && !/\s$/.test(before) ? (/[.!?]$/.test(before) ? " " : "\n") : "";
    ta.value = before + sep + text + after;
    const caret = (before + sep + text).length;
    ta.focus();
    ta.setSelectionRange(caret, caret);
  }

  function readForm() {
    const criteria = act.criteria.map((_, i) => { const x = document.querySelector(`input[name="c${i}"]:checked`); return x ? x.value : null; });
    const mv = $("fMark").value.trim();
    return { criteria, mark: mv === "" ? null : Number(mv), comment: $("fText").value.trim() };
  }

  function feedbackFor(info, d) {
    return {
      v: 1, activity: act.title, module: act.module, name: info.name,
      criteria: act.criteria.map((c, i) => ({ c, s: (d.criteria || [])[i] || null })),
      mark: d.mark, outOf: act.outOf, comment: d.comment, released: d.releasedAt, submitted: info.t,
    };
  }

  async function putFeedback(s, d) {
    const key = await MS.importAes(MS.b64d(s.info.rk));
    await svc("PUT", `/admin/feedback?r=${s.r}`, await MS.seal(key, MS.fromJSON(feedbackFor(s.info, d))));
  }
  async function putDraft(s, d) {
    await svc("PUT", `/admin/draft?a=${act.id}&r=${s.r}&rel=${d.released ? 1 : 0}&ai=${d.ai ? 1 : 0}`, await MS.seal(vault.vk, MS.fromJSON(d)));
    s.draft = { r: s.r, t: Date.now(), rel: !!d.released, ai: !!d.ai };
  }

  async function save(release) {
    const f = readForm();
    if (release && !f.comment && f.criteria.every((x) => !x) && f.mark === null) {
      say($("fStatus"), "Add a comment, a criterion or a mark before releasing.", "err");
      return;
    }
    if (f.mark !== null && (isNaN(f.mark) || f.mark < 0 || (act.outOf && f.mark > act.outOf))) {
      say($("fStatus"), "Check the mark" + (act.outOf ? ` (0–${act.outOf}).` : "."), "err");
      return;
    }
    const now = new Date().toISOString();
    const wasReleased = cur.draft && cur.draft.released;
    const keep = release || wasReleased;
    const d = { ...f, t: now, released: !!keep, releasedAt: keep ? (release ? now : cur.draft.releasedAt) : null, ai: false,
      reasons: cur.draft && cur.draft.reasons, aiModel: cur.draft && cur.draft.aiModel };
    try {
      if (keep) await putFeedback(cur.s, d);
      await putDraft(cur.s, d);
      cur.draft = d;
      fillForm(d);
      renderSubs();
    } catch (e) {
      say($("fStatus"), e.message || e.name, "err");
    }
  }

  $("saveDraft").onclick = () => cur && busy($("saveDraft"), "Saving…", () => save(false));
  $("release").onclick = () => cur && busy($("release"), "Releasing…", () => save(true));
  $("withdraw").onclick = () => cur && busy($("withdraw"), "Withdrawing…", async () => {
    if (!confirm("Withdraw this feedback? The student won't be able to see it until you release it again.")) return;
    try {
      await svc("DELETE", `/admin/feedback?r=${cur.s.r}`);
      const d = { ...readForm(), t: new Date().toISOString(), released: false, releasedAt: null };
      await putDraft(cur.s, d);
      cur.draft = d;
      fillForm(d);
      renderSubs();
    } catch (e) {
      say($("fStatus"), e.message || e.name, "err");
    }
  });

  async function getDraft(s) {
    return MS.toJSON(await MS.unseal(vault.vk, await (await svc("GET", `/admin/draft?a=${act.id}&r=${s.r}`)).arrayBuffer()));
  }

  $("releaseAll").onclick = () => busy($("releaseAll"), "Releasing…", async () => {
    const todo = subs.filter((s) => s.draft && !s.draft.rel);
    const m = $("sMsg");
    if (!todo.length) return say(m, "No unreleased drafts.");
    const unreviewed = todo.filter((s) => s.draft.ai).length;
    if (!confirm(`Release feedback to ${todo.length} student${todo.length === 1 ? "" : "s"}?` +
      (unreviewed ? `\n\n${unreviewed} of these ${unreviewed === 1 ? "is an AI draft" : "are AI drafts"} you haven't edited yet. Students will see ${unreviewed === 1 ? "it" : "them"} as written.` : ""))) return;
    let done = 0;
    try {
      for (const s of todo) {
        say(m, `Releasing ${++done} of ${todo.length}…`);
        const d = await getDraft(s);
        d.released = true;
        d.releasedAt = new Date().toISOString();
        d.ai = false;
        await putFeedback(s, d);
        await putDraft(s, d);
        if (cur && cur.s === s) { cur.draft = d; fillForm(d); }
      }
      say(m, `Released ${todo.length} ✓`, "ok");
    } catch (e) {
      say(m, e.message || e.name, "err");
    }
    renderSubs();
  });

  // ---------- AI drafts (text is extracted here, in your browser; only text is sent to the checker)
  const srcText = (v) => (Array.isArray(v) ? v.join("") : v || "");
  const unxml = (t) => t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  const byNum = (a, b) => (parseInt(a.replace(/\D+/g, "")) || 0) - (parseInt(b.replace(/\D+/g, "")) || 0);

  async function extractText(f) {
    const name = f.name.toLowerCase();
    const d = f.data;
    try {
      if (name.endsWith(".docx")) {
        await loadScript(MAMMOTH);
        return (await mammoth.extractRawText({ arrayBuffer: d.slice().buffer })).value;
      }
      if (name.endsWith(".pdf")) {
        await loadScript(PDFJS);
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        const doc = await pdfjsLib.getDocument({ data: d.slice() }).promise;
        const out = [];
        for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
          const tc = await (await doc.getPage(p)).getTextContent();
          out.push(tc.items.map((i) => i.str).join(" "));
        }
        const t = out.join("\n\n").trim();
        return t || "[this PDF has no readable text — it may be a scan]";
      }
      if (/\.(pptx|xlsx)$/.test(name)) {
        await loadScript(JSZIP);
        const z = await JSZip.loadAsync(d);
        const ppt = name.endsWith(".pptx");
        const parts = Object.keys(z.files).filter((p) => (ppt ? /^ppt\/slides\/slide\d+\.xml$/ : /^xl\/(sharedStrings|worksheets\/sheet\d+)\.xml$/).test(p)).sort(byNum);
        const out = [];
        for (const p of parts) {
          const x = await z.file(p).async("string");
          const re = ppt ? /<a:t>([^<]*)<\/a:t>/g : /<(?:t|v)(?:\s[^>]*)?>([^<]*)<\/(?:t|v)>/g;
          out.push(`[${p.split("/").pop()}] ` + [...x.matchAll(re)].map((m) => unxml(m[1])).join(" "));
        }
        return out.join("\n");
      }
      if (name.endsWith(".ipynb")) {
        const nb = MS.toJSON(d);
        return (nb.cells || []).map((c) => {
          const outs = (c.outputs || []).map((o) => {
            const t = o.text || (o.data && o.data["text/plain"]) || (o.ename ? `${o.ename}: ${o.evalue}` : "");
            return t ? "\n[output]\n" + srcText(t) : "";
          }).join("");
          return `[${c.cell_type}]\n` + srcText(c.source) + outs;
        }).join("\n\n");
      }
      if (name.endsWith(".zip")) {
        await loadScript(JSZIP);
        const z = await JSZip.loadAsync(d);
        const out = [];
        let total = 0;
        for (const [p, e] of Object.entries(z.files)) {
          if (e.dir) continue;
          if (TEXT.test(p) && total < 40000) {
            const t = (await e.async("string")).slice(0, 8000);
            out.push(`--- ${p} ---\n${t}`);
            total += t.length;
          } else out.push(`--- ${p} (not read) ---`);
        }
        return out.join("\n");
      }
      if (/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name)) return "[image file: the checker can't read images, look at it yourself]";
      if (TEXT.test(name) || looksText(d)) return MS.text(d);
      return "[file type the checker can't read]";
    } catch (e) {
      return `[couldn't read this file: ${e.message || e.name}]`;
    }
  }

  async function aiDraftFor(s, pkg) {
    if (!pkg) pkg = MS.unpack(await MS.openWith(vault.priv, await (await svc("GET", `/admin/sub?a=${act.id}&r=${s.r}`)).arrayBuffer()));
    const files = [];
    for (const f of pkg.files) files.push({ name: f.name, text: (await extractText(f)).slice(0, 14000) });
    const body = JSON.stringify({
      activity: { title: act.title, module: act.module, brief: act.brief, criteria: act.criteria, outOf: act.outOf, notes: act.notes || "" },
      submission: { note: pkg.header.note || "", files },
    });
    const r = await (await svc("POST", "/admin/ai", body)).json();
    const d = { criteria: r.criteria, mark: r.mark, comment: r.comment, reasons: r.reasons, aiModel: r.model, ai: true,
      t: new Date().toISOString(), released: false, releasedAt: null };
    await putDraft(s, d);
    return d;
  }

  $("aiOne").onclick = () => cur && busy($("aiOne"), "Drafting…", async () => {
    if (cur.draft && !cur.draft.ai && (cur.draft.comment || "").trim() && !confirm("Replace your draft with an AI draft?")) return;
    say($("fStatus"), "Reading the submission and drafting feedback… (10–30 seconds)");
    try {
      const s = cur.s;
      const d = await aiDraftFor(s, cur.pkg);
      if (cur && cur.s === s) { cur.draft = d; fillForm(d); }
      renderSubs();
    } catch (e) {
      say($("fStatus"), e.message || e.name, "err");
    }
  });

  $("aiAll").onclick = () => busy($("aiAll"), "Drafting…", async () => {
    const todo = subs.filter((s) => !s.draft && !s.earlier);
    const m = $("sMsg");
    if (!todo.length) return say(m, "Every current submission already has a draft or feedback.");
    if (!confirm(`Draft AI feedback for ${todo.length} new submission${todo.length === 1 ? "" : "s"}?\n\nNothing is sent to students until you release it.`)) return;
    let done = 0, failed = 0;
    for (const s of todo) {
      say(m, `Drafting ${done + failed + 1} of ${todo.length}… (about 10–30 seconds each)`);
      try {
        const d = await aiDraftFor(s);
        done++;
        if (cur && cur.s === s) { cur.draft = d; fillForm(d); }
        renderSubs();
      } catch (e) {
        if (e.status === 429 || e.status === 501) { say(m, e.message + (done ? ` (${done} drafted before stopping.)` : ""), "err"); renderSubs(); return; }
        failed++;
      }
    }
    renderSubs();
    say(m, `Drafted ${done}${failed ? `, ${failed} failed (open them and use Draft with AI to retry)` : ""}. Open each one to check it, then release.`, failed ? "err" : "ok");
  });

  // ---------- CSV
  const cell = (v) => {
    let s = v === null || v === undefined ? "" : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheets treating student text as formulas
    return '"' + s.replace(/"/g, '""') + '"';
  };
  $("exportCsv").onclick = () => busy($("exportCsv"), "Exporting…", async () => {
    try {
      const head = ["Student", "Student number", "Submitted", "Late", "Earlier attempt", ...act.criteria, "Mark", "Out of", "Status", "Released", "Comment"];
      const rows = [head];
      for (const s of subs) {
        const d = s.draft ? await getDraft(s) : null;
        rows.push([
          s.info.name, s.info.sid, MS.fmtDate(s.info.t), s.late ? "yes" : "", s.earlier ? "yes" : "",
          ...act.criteria.map((_, i) => (d && d.criteria && d.criteria[i] ? LABEL[d.criteria[i]] : "")),
          d ? d.mark : "", act.outOf || "", !d ? "Not started" : d.released ? "Released" : "Draft",
          d && d.releasedAt ? MS.fmtDate(d.releasedAt) : "", d ? d.comment : "",
        ]);
      }
      const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
      download(new Blob([csv], { type: "text/csv" }), safeName(`${act.module} ${act.title} feedback`) + ".csv");
    } catch (e) {
      say($("sMsg"), e.message || e.name, "err");
    }
  });

  start();
})();
</script>
</body>
</html>
