<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<title>Quick share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="ltop"></header>
<main class="wrap wide" style="max-width:1000px">
  <div id="app" hidden>
    <h1>Quick share</h1>
    <p class="lead">Share a few files with one code, outside your modules. Good for a one-off handout or a file for another lecturer's class.</p>

    <div class="card">
      <h2>Share files</h2>
      <form id="form">
        <div class="grid">
          <div><label for="title">Title</label><input id="title" required maxlength="120" placeholder="Revision notes"></div>
          <div><label for="module">Module (optional)</label><input id="module" maxlength="40" placeholder="QHO444"></div>
          <div><label for="days">Available for</label>
            <select id="days">
              <option value="1">1 day</option><option value="7" selected>1 week</option>
              <option value="30">30 days</option><option value="120">Semester (about 4 months)</option>
              <option value="0">Never expires</option>
            </select></div>
        </div>
        <label for="files">Files</label>
        <input id="files" type="file" multiple required>
        <p class="hint">Up to 50 MB per file. Files are encrypted on this computer before they're uploaded.</p>
        <p style="margin-top:16px"><button class="btn" id="create">Encrypt, upload &amp; create code</button></p>
        <p class="muted" id="progress"></p>
      </form>
    </div>

    <div class="card">
      <h2>Your quick shares</h2>
      <div id="list" style="overflow-x:auto"></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="gh.js"></script>
<script src="lecturer.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MAX_FILE = 50 * 1024 * 1024;
  let L = null;

  document.title = "Quick share · " + SITE.name;

  const local = () => { try { return JSON.parse(localStorage.getItem("ms-shares")) || []; } catch { return []; } };

  async function shares() {
    const ix = await L.loadIndex();
    ix.shares = ix.shares || [];
    // bring in shares created on this device before they were kept in your lecturer data
    const known = new Set(ix.shares.map((s) => s.code));
    const extra = local().filter((s) => !known.has(s.code));
    return { ix, list: [...ix.shares, ...extra], extra };
  }

  async function renderList() {
    const box = $("list");
    box.textContent = "";
    let list;
    try { ({ list } = await shares()); }
    catch (e) { box.append(Lecturer.el("p", { class: "err", text: e.message })); return; }
    if (!list.length) {
      box.append(Lecturer.el("p", { class: "muted", text: "Nothing shared yet." }));
      return;
    }
    const t = document.createElement("table");
    t.innerHTML = "<tr><th>Code</th><th>Title</th><th>Files</th><th>Expires</th><th></th></tr>";
    for (const s of list) {
      const tr = document.createElement("tr");
      const expired = s.expires && new Date(s.expires) < new Date();
      const code = document.createElement("td");
      const tiles = document.createElement("span");
      tiles.className = "code-sm";
      MS.tiles(tiles, s.code);
      code.append(tiles);
      if (expired) code.append(" ", Lecturer.el("span", { class: "chip", text: "Expired" }));
      tr.append(code);
      for (const v of [[s.module, s.title].filter(Boolean).join(": "), `${s.files}, ${MS.sizeText(s.size)}`, s.expires ? MS.fmtDate(s.expires) : "Never"]) {
        tr.append(Lecturer.el("td", { text: v }));
      }
      const del = Lecturer.el("button", { class: "btn danger small", text: "Delete" });
      del.onclick = () => removeShare(s, del);
      tr.append(Lecturer.el("td", {}, Lecturer.el("div", { class: "actions" },
        Lecturer.el("button", { class: "btn ghost small", text: "Show", onclick: () => present(s) }), del)));
      t.append(tr);
    }
    box.append(t);
  }

  async function removeShare(s, btn) {
    if (!confirm(`Delete ${MS.pretty(s.code)} (${s.title})? Students will no longer be able to open it.`)) return;
    await Lecturer.busy(btn, "Deleting…", async () => {
      try {
        let items = [];
        try { items = await L.gh.gh("/contents/s/" + s.id + "?ref=" + encodeURIComponent(L.conn.branch)); }
        catch (e) { if (e.status !== 404) throw e; }
        const { ix, extra } = await shares();
        ix.shares = [...ix.shares, ...extra].filter((x) => x.code !== s.code);
        await L.gh.commit([...items.map((it) => ({ path: it.path, remove: true })), await L.indexEntry(ix)], "Remove share");
        try { localStorage.removeItem("ms-shares"); } catch {}
        renderList();
      } catch (e) {
        alert("Couldn't delete: " + e.message);
      }
    });
  }

  $("form").onsubmit = async (ev) => {
    ev.preventDefault();
    const p = $("progress");
    const picked = [...$("files").files];
    const big = picked.filter((f) => f.size > MAX_FILE);
    if (big.length) return Lecturer.say(p, "Too large (max 50 MB each): " + big.map((f) => f.name).join(", "), "err");
    await Lecturer.busy($("create"), "Uploading…", async () => {
      try {
        Lecturer.say(p, "Encrypting…");
        const files = [];
        for (const f of picked) files.push({ name: f.name, type: f.type, data: await f.arrayBuffer() });
        const share = await MS.buildShare({ salt: SITE.salt, title: $("title").value.trim(), module: $("module").value.trim(), days: Number($("days").value), files });
        const rec = { code: share.code, id: share.id, title: share.manifest.title, module: share.manifest.module, created: share.manifest.created,
          expires: share.expires, files: files.length, size: files.reduce((a, f) => a + f.data.byteLength, 0) };
        const { ix, extra } = await shares();
        ix.shares = [rec, ...ix.shares, ...extra];
        Lecturer.say(p, "Uploading…");
        await L.gh.commit([...share.entries, await L.indexEntry(ix)], "Add share");
        try { localStorage.removeItem("ms-shares"); } catch {}
        $("form").reset();
        Lecturer.say(p, "");
        renderList();
        present(rec, true);
      } catch (e) {
        Lecturer.say(p, e.status === 403
          ? "Upload failed: your token can read this repository but not write to it. On GitHub open Settings, Developer settings, Fine-grained tokens, your token, Edit: set Repository access to this repo and Contents to Read and write, then try again."
          : "Upload failed: " + e.message, "err");
      }
    });
  };

  function present(s, fresh) {
    Lecturer.present({ title: [s.module, s.title].filter(Boolean).join(": "), code: s.code, fresh,
      sub: "Or open " + Lecturer.siteHost + "/#" + s.code });
  }

  Lecturer.ready("share").then((l) => { L = l; $("app").hidden = false; renderList(); });
})();
</script>
</body>
</html>
