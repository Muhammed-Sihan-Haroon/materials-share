name: CI

on:
  push:
    branches: [main]
    # Shares, activities and modules you publish from the site are commits too.
    # They only change data, so they don't need a test run.
    paths-ignore: ["s/**", "a/**", "m/**", "keys/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and script-policy checks
        run: node tests/check-syntax.mjs

  e2e:
    name: End-to-end tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test tools
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python tests/e2e.py
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/
          retention-days: 7
